<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Chiamate Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📞</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Tutti gli 8 font del builder (Impostazioni) caricati fin da subito, così lo
     switch tra stili è istantaneo e non serve un fetch a runtime. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Bebas+Neue&family=Playfair+Display:wght@600;700&family=Space+Mono:wght@400;700&family=Orbitron:wght@600;700&family=VT323&family=Unbounded:wght@600;700&display=swap">
<!-- Lexend: font di base del tool (leggibilità). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header id="topbar">
    <div class="brand">Chiamate Tracker</div>
    <nav id="mainNav">
      <button class="navlink" data-route="oggi" data-venditore-only>Oggi</button>
      <button class="navlink" data-route="dashboard">Dashboard</button>
      <button class="navlink" data-route="setting">Setting</button>
      <button class="navlink" data-route="venditore" data-venditore-only>Venditore</button>
    </nav>
    <div class="topbar-actions">
      <span id="syncStatus" class="sync-status" style="display:none;"></span>
      <!-- Esporta, Importa e 🎨 stanno dentro 👤 (Simone, 16/10: in alto solo quello che si usa sempre). -->
      <button id="btnAccount" class="btn-ghost" title="Account, backup e aspetto">👤</button>
      <button id="btnNuovaSessione" class="btn-primary">+ Nuova sessione</button>
    </div>
  </header>

  <main id="app"></main>

  <div id="loginScreen" class="login-screen" hidden>
    <form id="loginForm" class="login-card">
      <div class="login-title">📞 Chiamate Tracker</div>
      <label class="field">
        Email
        <input type="email" id="loginEmail" autocomplete="username" required>
      </label>
      <label class="field">
        Password
        <input type="password" id="loginPassword" autocomplete="current-password" required>
      </label>
      <div id="loginError" class="login-error"></div>
      <button type="submit" class="btn-primary" id="loginSubmit">Entra</button>
    </form>
  </div>

  <div id="modalRoot"></div>

  <script src="storage.js"></script>
  <script src="utils.js"></script>
  <script src="supabase-config.js"></script>
  <script src="cloud-sync.js"></script>
  <script src="lead.js"></script>
  <script src="app.js"></script>
</body>
</html>
